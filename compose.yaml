services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: x100vi
      POSTGRES_USER: x100vi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm owner:setup first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U x100vi -d x100vi']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
